# /usr/share/containers/systemd/inventory-service.container.d/10-defaults.conf
#
# =============================================================================
# inventory-service - Default Quadlet Drop-In
# =============================================================================
#
# Package-supplied defaults for the inventory-service container.  Do not edit
# this file; it is replaced on upgrade.  Override any key by dropping a
# higher-numbered file (e.g. 20-site.conf) into
# /etc/containers/systemd/inventory-service.container.d/, either by hand or via
# one of the OpenCHAMI deployment meta-configuration packages.
#
# Each option lists the equivalent inventory-service command line flag, where
# one exists.

[Container]

# -------------------------------------------------------------------------
# Networks
# -------------------------------------------------------------------------
# Assumes a single-node deployment of the OpenCHAMI core services alongside
# inventory-service.  The internal network carries inventory-service's traffic
# to tokensmith, and peer service traffic to inventory-service's API.

Network=openchami-internal.network

# All traffic is host-local; keep the host's proxy settings out of the way.
HttpProxy=false

# -------------------------------------------------------------------------
# Storage
# -------------------------------------------------------------------------
# inventory-service persists its inventory in a SQLite database.  The database
# lives on a named volume so it survives container restarts and upgrades.

Volume=inventory-service-data.volume:/data:rw,Z

# SQLite connection URL.  Points at the mounted data volume above.
#
# Flag: --database-url
Environment=INVENTORY_SERVICE_DATABASE_URL=file:/data/inventory.db?_fk=1

# -------------------------------------------------------------------------
# Server
# -------------------------------------------------------------------------
# Port the HTTP API listens on inside the container.
#
# Flag: --port
Environment=INVENTORY_SERVICE_PORT=8080

# -------------------------------------------------------------------------
# Authentication
# -------------------------------------------------------------------------
# Defaults to the TokenSmith instance colocated in the same deployment.  To
# disable authentication entirely, set INVENTORY_SERVICE_AUTH_ENABLED=false.

# Enable TokenSmith JWT validation on the API.
#
# Flag: --auth-enabled
Environment=INVENTORY_SERVICE_AUTH_ENABLED=true

# Key set used to verify token signatures.  Required when auth is enabled;
# inventory-service refuses to start if it is unset.
Environment=TOKENSMITH_JWKS_URL=http://tokensmith:8080/.well-known/jwks.json
