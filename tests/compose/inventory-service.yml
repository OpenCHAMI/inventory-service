services:
###
# Inventory Containers
###
  inventory-service:
    image: ${INVENTORY_SERVICE_IMAGE}
    container_name: inventory-service
    command: serve --port 8080 --database-url "postgres://inventory-user:password@postgres:5432/inventorydb?sslmode=disable" --schema /schemas/csm --read-timeout 60 --write-timeout 60
    hostname: inventory
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

