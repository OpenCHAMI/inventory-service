services:
###
# Inventory Containers
###
  inventory-service:
    image: ${INVENTORY_SERVICE_IMAGE}
    container_name: inventory-service
    command: serve --port 8080 --database-url file:/data/inventory.db?_fk=1 --schema /schemas/csm --read-timeout 60 --write-timeout 60 --auth-enabled=false
    hostname: inventory
    networks:
      - internal
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/hsm/v2/service/ready"]
      interval: 5s
      timeout: 3s
      retries: 60

